<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Regions — Player</title>
  <style>
    html, body { margin:0; min-height:100%; background:#101820; color:white; font-family:system-ui,Arial,sans-serif; }
    body { overflow-x:hidden; }
    header { padding:18px 22px 8px; text-align:center; z-index:2; }
    h1 { margin:0; font-size:clamp(28px,4vw,52px); letter-spacing:.04em; }
    .subtitle { margin-top:6px; color:#c8d5df; font-size:15px; }
    #stats { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin:14px auto 0; padding:0 16px; max-width:900px; }
    .stat-card { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16); border-radius:14px; padding:10px 14px; min-width:110px; text-align:center; }
    .stat-card strong { display:block; font-size:20px; }
    .stat-card span { display:block; margin-top:2px; color:rgba(255,255,255,.68); font-size:12px; }
    #globe-wrap { position:relative; display:grid; place-items:center; overflow:hidden; height:min(74vh,820px); min-height:460px; }
    svg { width:min(78vh,96vw); height:min(78vh,96vw); min-width:360px; min-height:360px; cursor:grab; user-select:none; touch-action:none; }
    svg:active { cursor:grabbing; }
    .sphere { fill:#15324a; stroke:#7fa4c2; stroke-width:1.2; }
    .graticule { fill:none; stroke:rgba(255,255,255,.18); stroke-width:.5; }
    .land-base { fill:#d8d0b8; stroke:none; }
    .land-outline { fill:none; stroke:#26342b; stroke-width:.55; pointer-events:none; }
    .region-player { stroke:white; stroke-width:1.65; cursor:pointer; pointer-events:all; }
    .region-player:hover { stroke-width:2.8; filter:drop-shadow(0 0 7px rgba(255,255,255,.75)); }
    .arctic-circle { fill:none; stroke:#fff; stroke-width:1.45; stroke-dasharray:5 5; opacity:.85; pointer-events:none; }
    .tooltip { position:fixed; display:none; pointer-events:none; background:rgba(12,18,25,.94); color:white; border:1px solid rgba(255,255,255,.25); border-radius:10px; padding:9px 11px; font-size:14px; box-shadow:0 8px 25px rgba(0,0,0,.35); z-index:10; max-width:280px; }
    .tooltip strong { display:block; font-size:15px; margin-bottom:3px; }
    .legend { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin:-4px auto 16px; padding:0 16px; max-width:900px; }
    .legend-item { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:rgba(255,255,255,.78); background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.13); border-radius:999px; padding:5px 9px; }
    .legend-swatch { width:12px; height:12px; border-radius:50%; border:1px solid rgba(255,255,255,.45); display:inline-block; }
    .table-wrap { max-width:980px; margin:0 auto 40px; padding:0 16px; }
    table { width:100%; border-collapse:collapse; overflow:hidden; border-radius:14px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.14); }
    th,td { padding:10px 12px; border-bottom:1px solid rgba(255,255,255,.10); text-align:left; font-size:14px; }
    th { color:rgba(255,255,255,.72); font-weight:600; background:rgba(255,255,255,.06); }
    tr:last-child td { border-bottom:none; }
    a { color:inherit; }
    .medal { font-weight:700; white-space:nowrap; }
    .bottom-link { position:fixed; left:16px; bottom:14px; color:rgba(255,255,255,.55); font-size:13px; z-index:2; text-decoration:none; }
    .bottom-link:hover { color:rgba(255,255,255,.9); text-decoration:underline; }
  </style>
</head>

<body>
  <header>
    <h1 id="player-title">Player</h1>
    <div class="subtitle">Regional challenge progress</div>
    <div id="stats"></div>
  </header>

  <main id="globe-wrap">
    <svg id="globe" viewBox="0 0 900 900"><defs></defs></svg>
    <div id="tooltip" class="tooltip"></div>
  </main>

  <div class="legend" id="legend"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Region</th><th>Best score</th><th>Time</th><th>Medal</th><th>Challenge</th></tr>
      </thead>
      <tbody id="score-table"></tbody>
    </table>
  </div>

  <a class="bottom-link" href="index.html">← Globe</a>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
  <script>
    const CONFIG_URL = "data/regions.json?v=2";
    const SCORES_URL = "data/player_scores.tsv?v=1";
    const LAND_URL = "https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json";
    const CHALLENGE_BASE_URL = "https://www.geoguessr.com/challenge/";

    const params = new URLSearchParams(window.location.search);
    const selectedPlayerId = params.get("id") || "ted";

    const medalInfo = {
      none:      { label: "Not played", color: "rgba(255,255,255,0.05)" },
      bronze:    { label: "Bronze",     color: "#b87333" },
      silver:    { label: "Silver",     color: "#c0c0c0" },
      gold:      { label: "Gold",       color: "#ffd166" },
      diamond:   { label: "Diamond",    color: "#6ee7ff" },
      emerald:   { label: "Emerald",    color: "#50c878" },
      netherite: { label: "Netherite",  color: "#2b2430" }
    };

    const svg = d3.select("#globe");
    const tooltip = d3.select("#tooltip");
    const width = 900, height = 900;

    let baseScale = 390, currentScale = baseScale;
    let spinning = false, spinTimer = null;
    let rotation = [75, -68, 0], targetRotation = [75, -68, 0], smoothTimer = null;
    let landData = null, regions = [];
    let bestByRegion = new Map();
    let allRegionsConfig = [];

    const projection = d3.geoOrthographic().scale(currentScale).translate([width/2,height/2]).rotate(rotation).clipAngle(90);
    const path = d3.geoPath(projection);
    const graticule = d3.geoGraticule10();
    const sphere = { type: "Sphere" };
    const arcticCircle = { type:"LineString", coordinates:d3.range(-180,181,1).map(lon => [lon,66.5636]) };

    const g = svg.append("g");
    g.append("path").datum(sphere).attr("class","sphere");
    g.append("path").datum(graticule).attr("class","graticule");

    const defs = svg.select("defs");
    const landClip = defs.append("clipPath").attr("id","landClip");
    const landClipPath = landClip.append("path");

    const landBasePath = g.append("path").attr("class","land-base");
    const regionGroup = g.append("g").attr("clip-path","url(#landClip)");
    const oceanRegionGroup = g.append("g");
    const landOutlinePath = g.append("path").attr("class","land-outline");
    const arcticPath = g.append("path").datum(arcticCircle).attr("class","arctic-circle");

    function reverseGeoJSONRings(obj) {
      const copy = JSON.parse(JSON.stringify(obj));
      function reverseGeometry(geom) {
        if (!geom) return;
        if (geom.type === "Polygon") geom.coordinates = geom.coordinates.map(ring => [...ring].reverse());
        else if (geom.type === "MultiPolygon") geom.coordinates = geom.coordinates.map(poly => poly.map(ring => [...ring].reverse()));
        else if (geom.type === "GeometryCollection") geom.geometries.forEach(reverseGeometry);
      }
      if (copy.type === "FeatureCollection") copy.features.forEach(f => reverseGeometry(f.geometry));
      else if (copy.type === "Feature") reverseGeometry(copy.geometry);
      else reverseGeometry(copy);
      return copy;
    }

    function normalizeLon(lon) { return ((lon + 180) % 360 + 360) % 360 - 180; }
    function clampLat(lat) { return Math.max(-89.5, Math.min(89.5, lat)); }
    function formatScore(score) { if (!score || score <= 0) return "—"; return Number(score).toLocaleString("en-US"); }
    function formatTime(seconds) {
      if (!seconds || !isFinite(seconds)) return "—";
      seconds = Math.round(Number(seconds));
      const m = Math.floor(seconds / 60), s = seconds % 60;
      return `${m}:${String(s).padStart(2,"0")}`;
    }

    function medalForAttempt(attempt) {
      if (!attempt || !attempt.score) return "none";
      const score = Number(attempt.score), time = Number(attempt.time_seconds);
      if (score === 25000 && time > 0 && time < 600) return "netherite";
      if (score === 25000 && time > 0 && time < 900) return "emerald";
      if (score === 25000) return "diamond";
      if (score >= 22500) return "gold";
      if (score >= 15000) return "silver";
      if (score >= 5000) return "bronze";
      return "none";
    }

    function isBetterAttempt(newAttempt, oldAttempt) {
      if (!oldAttempt) return true;
      const newScore = Number(newAttempt.score), oldScore = Number(oldAttempt.score);
      if (newScore > oldScore) return true;
      if (newScore < oldScore) return false;
      return Number(newAttempt.time_seconds || Infinity) < Number(oldAttempt.time_seconds || Infinity);
    }

    function showTooltip(event, region) {
      const best = bestByRegion.get(region.id);
      const medal = medalForAttempt(best);
      const scoreLine = best ? `${formatScore(best.score)} · ${formatTime(best.time_seconds)} · ${medalInfo[medal].label}` : "Not played yet";
      tooltip.style("display","block").style("left",`${event.clientX+14}px`).style("top",`${event.clientY+14}px`).html(`<strong>${region.name}</strong><span>${scoreLine}</span>`);
    }
    function hideTooltip() { tooltip.style("display","none"); }

    function redraw() {
      g.select(".sphere").attr("d",path);
      g.select(".graticule").attr("d",path);
      if (landData) {
        landBasePath.datum(landData).attr("d",path);
        landOutlinePath.datum(landData).attr("d",path);
        landClipPath.datum(landData).attr("d",path);
      }
      regions.forEach(region => region.path.datum(region.geojson).attr("d",path));
      arcticPath.attr("d",path);
    }

    function applyRotation(r) {
      rotation = [normalizeLon(r[0]), clampLat(r[1]), 0];
      projection.rotate(rotation);
      hideTooltip();
      redraw();
    }

    function startSmoothLoop() {
      if (smoothTimer) return;
      smoothTimer = d3.timer(() => {
        const ease = .18;
        let lonDiff = targetRotation[0] - rotation[0];
        if (lonDiff > 180) lonDiff -= 360;
        if (lonDiff < -180) lonDiff += 360;
        const latDiff = targetRotation[1] - rotation[1];
        if (Math.abs(lonDiff) < .01 && Math.abs(latDiff) < .01) {
          applyRotation(targetRotation);
          smoothTimer.stop();
          smoothTimer = null;
          return;
        }
        applyRotation([rotation[0] + lonDiff * ease, rotation[1] + latDiff * ease, 0]);
      });
    }

    function setTargetRotation(r) { targetRotation = [normalizeLon(r[0]), clampLat(r[1]), 0]; startSmoothLoop(); }
    function setView(view) {
      const views = { arctic:[0,-90,0], canada:[75,-68,0], atlantic:[24,-18,0] };
      setTargetRotation(views[view] || views.canada);
    }

    function toggleSpin() {
      spinning = !spinning;
      if (spinning) {
        if (smoothTimer) { smoothTimer.stop(); smoothTimer = null; }
        spinTimer = d3.timer(() => {
          targetRotation = [normalizeLon(targetRotation[0] + .12), targetRotation[1], 0];
          applyRotation([rotation[0] + .12, rotation[1], 0]);
        });
      } else if (spinTimer) {
        spinTimer.stop();
        spinTimer = null;
      }
    }

    function parseTsv(text) {
      return d3.tsvParse(text).map(row => ({ ...row, score:Number(row.score || 0), time_seconds:Number(row.time_seconds || 0) }));
    }

    function buildBestScores(attempts) {
      bestByRegion = new Map();
      const playerAttempts = attempts.filter(row => row.player_id === selectedPlayerId);
      const playerName = playerAttempts[0]?.player || selectedPlayerId;
      document.getElementById("player-title").textContent = playerName;
      playerAttempts.forEach(attempt => {
        const old = bestByRegion.get(attempt.region_id);
        if (isBetterAttempt(attempt, old)) bestByRegion.set(attempt.region_id, attempt);
      });
    }

    function renderLegend() {
      const order = ["bronze","silver","gold","diamond","emerald","netherite","none"];
      document.getElementById("legend").innerHTML = order.map(key => `
        <span class="legend-item"><span class="legend-swatch" style="background:${medalInfo[key].color}"></span>${medalInfo[key].label}</span>
      `).join("");
    }

    function renderStats() {
      const bests = [...bestByRegion.values()];
      const played = bests.length;
      const perfects = bests.filter(a => Number(a.score) === 25000).length;
      const totalScore = bests.reduce((sum, a) => sum + Number(a.score || 0), 0);
      document.getElementById("stats").innerHTML = `
        <div class="stat-card"><strong>${played}/${allRegionsConfig.length}</strong><span>regions played</span></div>
        <div class="stat-card"><strong>${perfects}</strong><span>perfects</span></div>
        <div class="stat-card"><strong>${formatScore(totalScore)}</strong><span>total best score</span></div>
      `;
    }

    function renderTable() {
      const tbody = document.getElementById("score-table");
      tbody.innerHTML = allRegionsConfig.map(region => {
        const best = bestByRegion.get(region.id);
        const medal = medalForAttempt(best);
        const color = medalInfo[medal].color;
        const challengeId = best?.challenge_id || "";
        const challengeUrl = challengeId ? `${CHALLENGE_BASE_URL}${challengeId}` : region.challenge_url;
        return `<tr>
          <td>${region.name}</td>
          <td>${formatScore(best?.score)}</td>
          <td>${formatTime(best?.time_seconds)}</td>
          <td class="medal" style="color:${color}">${medalInfo[medal].label}</td>
          <td>${challengeUrl ? `<a href="${challengeUrl}" target="_blank">open</a>` : "—"}</td>
        </tr>`;
      }).join("");
    }

    let dragStart = null, dragStartRotation = null;

    svg.call(d3.drag()
      .on("start", event => {
        if (spinning) toggleSpin();
        if (smoothTimer) { smoothTimer.stop(); smoothTimer = null; }
        hideTooltip();
        dragStart = [event.x,event.y];
        dragStartRotation = [...rotation];
        targetRotation = [...rotation];
      })
      .on("drag", event => {
        const zoomFactor = currentScale / baseScale;
        const speed = .35 / zoomFactor;
        const dx = event.x - dragStart[0], dy = event.y - dragStart[1];
        const newLon = dragStartRotation[0] + dx * speed;
        const newLat = dragStartRotation[1] - dy * speed;
        targetRotation = [normalizeLon(newLon), clampLat(newLat), 0];
        applyRotation(targetRotation);
      })
      .on("end", () => { dragStart = null; dragStartRotation = null; })
    );

    svg.call(d3.zoom()
      .scaleExtent([.6,8])
      .filter(event => event.type === "wheel")
      .on("zoom", event => {
        currentScale = baseScale * event.transform.k;
        projection.scale(currentScale);
        hideTooltip();
        redraw();
      })
    );

    svg.on("dblclick.zoom", null);
    svg.on("dblclick", () => setView("canada"));

    async function load() {
      const [config, attemptsText, world] = await Promise.all([
        d3.json(CONFIG_URL),
        d3.text(SCORES_URL),
        d3.json(LAND_URL)
      ]);

      allRegionsConfig = config.regions;
      buildBestScores(parseTsv(attemptsText));
      landData = topojson.feature(world, world.objects.land);

      for (const item of config.regions) {
        let geojson = await d3.json(item.geojson);
        if (item.needsReverse) geojson = reverseGeoJSONRings(geojson);

        const best = bestByRegion.get(item.id);
        const medal = medalForAttempt(best);
        const fillColor = medalInfo[medal].color;
        const clipToLand = item.clipToLand !== false;
        const targetGroup = clipToLand ? regionGroup : oceanRegionGroup;

        const regionPath = targetGroup.append("path")
          .attr("class","region-player")
          .attr("fill",fillColor)
          .attr("fill-opacity",medal === "none" ? .35 : .78)
          .on("mouseenter", event => showTooltip(event,item))
          .on("mousemove", event => showTooltip(event,item))
          .on("mouseleave", hideTooltip)
          .on("click", () => {
            const challengeId = best?.challenge_id;
            const url = challengeId ? `${CHALLENGE_BASE_URL}${challengeId}` : item.challenge_url;
            if (url) window.open(url,"_blank");
          });

        regions.push({ ...item, geojson, path:regionPath });
      }

      renderLegend();
      renderStats();
      renderTable();
      redraw();
    }

    load();
    window.setView = setView;
    window.toggleSpin = toggleSpin;
  </script>
</body>
</html>
