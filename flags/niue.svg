<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Niue – circular flag icon</title>
  <defs>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="248"/>
    </clipPath>
    <clipPath id="cantonClip">
      <rect x="48" y="60" width="224" height="168" rx="2"/>
    </clipPath>
    <path id="star" d="M0,-14 L3.29,-4.53 L13.31,-4.33 L5.32,1.73 L8.23,11.33 L0,5.6 L-8.23,11.33 L-5.32,1.73 L-13.31,-4.33 L-3.29,-4.53 Z"/>
  </defs>

  <g clip-path="url(#circleClip)">
    <rect width="512" height="512" fill="#FEDD00"/>

    <!-- Union Jack canton, inset so the key details survive the circular crop -->
    <g clip-path="url(#cantonClip)">
      <rect x="48" y="60" width="224" height="168" fill="#012169"/>

      <!-- white diagonals -->
      <path d="M48 60 L272 228 M272 60 L48 228" stroke="#FFFFFF" stroke-width="34"/>
      <!-- red diagonals -->
      <path d="M48 60 L272 228 M272 60 L48 228" stroke="#C8102E" stroke-width="18"/>

      <!-- white cross -->
      <rect x="143" y="60" width="34" height="168" fill="#FFFFFF"/>
      <rect x="48" y="127" width="224" height="34" fill="#FFFFFF"/>
      <!-- red cross -->
      <rect x="150" y="60" width="20" height="168" fill="#C8102E"/>
      <rect x="48" y="134" width="224" height="20" fill="#C8102E"/>
    </g>

    <!-- Niue stars in the canton -->
    <g transform="translate(160 144)">
      <circle r="22" fill="#012169"/>
      <use href="#star" fill="#FEDD00" transform="scale(0.95)"/>
      <use href="#star" fill="#FEDD00" transform="translate(-73 0) scale(0.78)"/>
      <use href="#star" fill="#FEDD00" transform="translate(73 0) scale(0.78)"/>
      <use href="#star" fill="#FEDD00" transform="translate(0 -55) scale(0.78)"/>
      <use href="#star" fill="#FEDD00" transform="translate(0 55) scale(0.78)"/>
    </g>
  </g>
</svg>
